<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ClearPhone — главный экран</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #ffffff; }
  body { font-family: "Roboto", "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; }

  /* 360x800 dp — типичный экран Android-телефона */
  .screen {
    width: 360px;
    height: 800px;
    background: #F2F3F5;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* Строка состояния Android 15 */
  .statusbar {
    height: 26px;
    flex: 0 0 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    font-size: 12px;
    font-weight: 500;
    color: #202124;
  }
  .statusbar .right { display: flex; align-items: center; gap: 5px; }
  .statusbar svg { display: block; }

  /* Контент */
  .content {
    flex: 1 1 auto;
    padding: 8px 14px 28px 14px;
    overflow: hidden;
  }

  h1 {
    font-size: 24px;
    line-height: 32px;
    font-weight: 700;
    color: #000000;
    padding-bottom: 8px;
  }
  .subtitle {
    font-size: 13px;
    line-height: 19px;
    color: #202124;
    padding: 2px 0;
  }

  .card {
    background: #FFFFFF;
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 10px;
    margin-bottom: 8px;
  }
  .card .label {
    font-size: 16px;
    line-height: 22px;
    font-weight: 700;
    color: #202124;
    padding: 2px 0;
  }
  .card .line {
    font-size: 14px;
    line-height: 20px;
    color: #202124;
    padding: 2px 0;
  }
  .card .small {
    font-size: 13px;
    line-height: 19px;
    color: #202124;
    padding: 2px 0;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 46px;
    margin-bottom: 6px;
    background: #F5F5F5;
    border: 1px solid #DADCE0;
    border-radius: 3px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: #000000;
  }

  .navpill {
    position: absolute;
    bottom: 7px;
    left: 50%;
    transform: translateX(-50%);
    width: 108px;
    height: 4px;
    border-radius: 2px;
    background: #9AA0A6;
    opacity: .75;
  }
</style>
</head>
<body>
<div class="screen" id="screen" role="img" aria-label="Главный экран ClearPhone">
  <div class="statusbar">
    <span>9:41</span>
    <span class="right">
      <!-- signal -->
      <svg width="15" height="11" viewBox="0 0 15 11" fill="#202124" aria-hidden="true">
        <rect x="0" y="7" width="2.5" height="4" rx=".6"/>
        <rect x="4" y="5" width="2.5" height="6" rx=".6"/>
        <rect x="8" y="2.5" width="2.5" height="8.5" rx=".6"/>
        <rect x="12" y="0" width="2.5" height="11" rx=".6"/>
      </svg>
      <!-- wifi -->
      <svg width="14" height="11" viewBox="0 0 14 11" fill="#202124" aria-hidden="true">
        <path d="M7 10.6 9.1 8.2a3.2 3.2 0 0 0-4.2 0L7 10.6Z"/>
        <path d="M7 4.6c1.5 0 2.9.6 4 1.6l1.2-1.4A8 8 0 0 0 7 2.6a8 8 0 0 0-5.2 2.2l1.2 1.4a5.9 5.9 0 0 1 4-1.6Z"/>
      </svg>
      <!-- battery -->
      <svg width="22" height="11" viewBox="0 0 22 11" aria-hidden="true">
        <rect x=".5" y=".5" width="18" height="10" rx="2.2" fill="none" stroke="#202124" stroke-opacity=".55"/>
        <rect x="2" y="2" width="13" height="7" rx="1.2" fill="#202124"/>
        <path d="M20 3.6v3.8c.8-.3 1.2-.9 1.2-1.9s-.4-1.6-1.2-1.9Z" fill="#202124" opacity=".55"/>
      </svg>
    </span>
  </div>

  <div class="content">
    <h1>ClearPhone</h1>
    <div class="subtitle">Личная уборка телефона</div>

    <div class="card">
      <div class="label">Хранилище</div>
      <div class="line">Занято 33.4 ГБ из 105.6 ГБ</div>
      <div class="line">Свободно 72.2 ГБ</div>
      <div class="small">ОЗУ: 3.1 ГБ свободно из 5.5 ГБ</div>
    </div>

    <div class="btn">Большие файлы</div>
    <div class="btn">Дубликаты</div>
    <div class="btn">Размер папок</div>
    <div class="btn">Приложения</div>
    <div class="btn">Ускорение и кэш</div>
    <div class="btn">Обновить</div>
  </div>

  <div class="navpill"></div>
</div>
</body>
</html>
